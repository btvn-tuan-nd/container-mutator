# Publish s6-overlay-style integration tarballs on every tag.
#
# Consumers install with one line: ADD container-mutator-integration-linux-amd64.tar.gz /
#
# The Dockerfile's `artifact` target produces the tarball, the raw binary, and
# SHA256SUMS. We only rename and attach them to the GitHub release; the build
# itself (including pinned crane and license files) stays in the Dockerfile.
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "$GITHUB_REF_NAME" --generate-notes

  release:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
          - platform: linux/arm64
            arch: arm64
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Build integration tarball
        uses: docker/build-push-action@v6
        with:
          context: .
          target: artifact
          platforms: ${{ matrix.platform }}
          outputs: type=local,dest=dist/${{ matrix.arch }}

      - name: Attach release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eux
          cd "dist/${{ matrix.arch }}"
          mv mutator "mutator-linux-${{ matrix.arch }}"
          sha256sum "container-mutator-integration-linux-${{ matrix.arch }}.tar.gz" \
            "mutator-linux-${{ matrix.arch }}" > "SHA256SUMS-${{ matrix.arch }}"
          gh release upload "${GITHUB_REF_NAME}" \
            "container-mutator-integration-linux-${{ matrix.arch }}.tar.gz" \
            "mutator-linux-${{ matrix.arch }}" \
            "SHA256SUMS-${{ matrix.arch }}" \
            --clobber
