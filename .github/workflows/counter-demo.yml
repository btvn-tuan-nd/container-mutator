name: GHCR counter demo

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ghcr-counter-demo
  cancel-in-progress: false

jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Publish and exercise counter updates
        env:
          GH_TOKEN: ${{ github.token }}
          GH_USER: ${{ github.actor }}
          GH_OWNER: ${{ github.repository_owner }}
        run: |
          set -eu
          export DOCKER_CONFIG=$(mktemp -d)
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GH_USER" --password-stdin
          export REGISTRY="ghcr.io/$(printf '%s' "$GH_OWNER" | tr '[:upper:]' '[:lower:]')"
          ./examples/counter/demo.sh
