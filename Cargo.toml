[package]
name = "container-mutator"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "mutator"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
fs2 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = "0.4"
tempfile = "3"
zstd = "0.13"
