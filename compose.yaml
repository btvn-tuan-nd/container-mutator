services:
  mutator:
    build:
      context: .
      target: final
    image: localhost:5000/container-mutator:dev

  registry:
    image: registry:3
    restart: unless-stopped
    ports:
      # Plain HTTP without authentication: local testing only.
      # Host clients use localhost:5000; Compose services use registry:5000.
      - "127.0.0.1:5000:5000"
    volumes:
      - registry-data:/var/lib/registry
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:5000/v2/"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # Published by examples/counter/publish.sh runtime; see README.
  counter:
    profiles: ["update-demo"]
    image: localhost:5000/container-mutator-counter:runtime
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      MUTATOR_IMAGE: registry:5000/container-mutator-counter:live
      MUTATOR_INSECURE_REGISTRY: "true"
      MUTATOR_POLL_INTERVAL: "2"
      MUTATOR_TIMEOUT: "6"
    depends_on:
      registry:
        condition: service_healthy

volumes:
  registry-data:
