services:
  mutator:
    build: .
    image: localhost:5000/mutator:dev

  registry:
    image: registry:3
    restart: unless-stopped
    ports:
      # Plain HTTP without authentication: local testing only.
      # Host clients use localhost:5000; Compose services use registry:5000.
      - "127.0.0.1:5000:5000"
    volumes:
      - registry-data:/var/lib/registry
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:5000/v2/"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  registry-data:
