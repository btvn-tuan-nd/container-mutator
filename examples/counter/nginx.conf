user nginx;
worker_processes 1;
pid /run/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 128; }
http {
    access_log /dev/stdout;
    default_type text/plain;
    server {
        listen 8080;
        root /srv/site;
        index index.html;
        add_header Cache-Control "no-store" always;
    }
}
